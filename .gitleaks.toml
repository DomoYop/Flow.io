# Configuration gitleaks pour flow.io.
#
# Les regles par defaut sont conservees ; l'allowlist ne neutralise que des
# identifiants de cles Runtime UI, qui declenchent `generic-api-key` sans etre
# des secrets.
#
# gitleaks scanne tout l'historique, pas seulement HEAD : ces motifs doivent
# donc couvrir aussi des noms qui n'existent plus dans le code actuel. Les
# 7 faux positifs constates au premier run complet (393 commits) :
#   30e907c  "key": "ina226.voltage"   RuntimeUiManifestJson_Generated.h + IOModule/text/runtimeui.json
#   37e96a1  "key": "ina228.voltage"   idem
#   cf87929  key = "io.bmp280_temp"    WebInterfaceServer.cpp (3 lignes voisines)
# `ina226` et `ina228` sont les anciens backends unifies depuis en POWERMON :
# une allowlist qui enumere les capteurs actuels ne les couvrirait pas.
#
# Si le job `gitleaks` echoue sur un nouveau faux positif, verifier d'abord la
# ligne au commit indique par le `Fingerprint:` du log, puis etendre une regex
# ci-dessous. Ne pas desactiver la regle ni le job.

[extend]
useDefault = true

[allowlist]
description = "Identifiants de cles Runtime UI (domaine.mesure) : ce ne sont pas des secrets"
regexTarget = "line"
regexes = [
  # Manifestes Runtime UI et leurs sources : "key": "ina226.voltage".
  '''"key"\s*:\s*"[a-z][a-z0-9_]*(?:\.[a-z0-9_]+)+"''',
  # Meme identifiant cote C++ : const char* key = "io.bmp280_temp".
  '''\bkey = "[a-z][a-z0-9_]*(?:\.[a-z0-9_]+)*"''',
  # Traces de diagnostic I2C (IOModule.cpp) : la ligne lit le *nom* d'une cle
  # NVS et son repli "(null)", jamais une valeur.
  #   const char* sdaKeyActive = i2cSdaVar_.nvsKey ? i2cSdaVar_.nvsKey : "(null)";
  # Ne pas retirer cette entree en constatant qu'aucun finding ne la mentionne :
  # c'est precisement le signe qu'elle fait son travail. Elle a ete supprimee
  # une fois sur ce raisonnement, ce qui a rouvert 2 faux positifs
  # (7b67552:src/Modules/IOModule/IOModule.cpp:37 et :38).
  '''\w*KeyActive = \w+\.nvsKey''',
]

# Ces deux motifs restent etroits : minuscules, chiffres, underscores et points
# uniquement. Une vraie cle d'API (longue, majuscules melangees, base64 ou hex)
# ne les satisfait pas, donc l'allowlist ne cree pas d'angle mort general sur
# `generic-api-key`.

# Pas d'allowlist de chemins : ni binary/ ni les assets .gz ne sont versionnes
# ici (ils sont produits par export_binaries.py et prepare_spiffs_data.py au
# build), donc rien a exclure du scan.
