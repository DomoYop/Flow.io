# Home Assistant helper entities for Flow.io alarms.
#
# This file is meant to be included from Home Assistant configuration.yaml:
#
# template: !include docs/integration/home_assistant_alarm_helpers_fio53.yaml
#
# Current firmware behavior for Flow.io:
# - Flow.io auto-discovers one `binary_sensor.*` per registered alarm, fed by
#   the retained MQTT topic `rt/alarms/id<AlarmId>` (field `a`):
#     AlarmId 1000 -> binary_sensor.fio53_alm_pressure_low
#     AlarmId 1001 -> binary_sensor.fio53_alm_pressure_high
#     AlarmId 1002 -> binary_sensor.fio53_alm_ph_tank_low
#     AlarmId 1003 -> binary_sensor.fio53_alm_chlorine_tank_low
#     AlarmId 1004 -> binary_sensor.fio53_alm_ph_pump_max_uptime
#     AlarmId 1005 -> binary_sensor.fio53_alm_chlorine_pump_max_uptime
#     AlarmId 1006 -> binary_sensor.fio53_alm_water_level_low
#     AlarmId 1007 -> binary_sensor.fio53_alm_ph_dose_no_effect
#     AlarmId 1008 -> binary_sensor.fio53_alm_water_temp_unavailable
# - Flow.io auto-discovers `binary_sensor.fio53_alm_any`, fed by the retained
#   topic `rt/alarms/m` (field `a`, active alarm count).
# - Flow.io auto-discovers `sensor.fio53_alm_pack` for alarm state packing.
# - Flow.io auto-discovers one global `button.*` reset entity using
#   the MQTT command path `{"cmd":"alarms.reset_all"}`.
# - Flow.io auto-discovers one `button.*` per slot `0..7` using
#   the MQTT command path `{"cmd":"alarms.reset_slot","args":{"slot":N}}`.
#
# The `fio53` part of every entity id above is the configured Home Assistant
# entity prefix. Adjust it here if the device uses another prefix.
#
# The `*_active` helpers below are now plain aliases of those native entities.
# They exist only to keep the entity ids used by the dashboard stable, and no
# longer depend on the alarm registration order.
#
# `*_resettable` and `*_condition` are still decoded from
# `sensor.fio53_alm_pack`, built in `AlarmModule::buildPacked_()` with 5 bits
# per slot:
# - bit 0: active
# - bit 1: resettable
# - bit 2: condition == true
# - bits 3..4: severity
#
# Those two aspects are the only ones left depending on the slot order, which
# follows the alarm registration order in `PoolLogicLifecycle.cpp`:
# - slot 0 -> AlarmId 1000 -> pressure_low
# - slot 1 -> AlarmId 1001 -> pressure_high
# - slot 2 -> AlarmId 1002 -> ph_tank_low
# - slot 3 -> AlarmId 1003 -> chlorine_tank_low
# - slot 4 -> AlarmId 1004 -> ph_pump_max_uptime
# - slot 5 -> AlarmId 1005 -> chlorine_pump_max_uptime
# - slot 6 -> AlarmId 1006 -> pool_water_level_low
# - slot 7 -> AlarmId 1007 -> ph_dose_no_effect
#
# If that registration order changes, only the `*_resettable` and
# `*_condition` divisors below must be updated. To remove that dependency as
# well, expose fields `r` and `c` of `rt/alarms/id<AlarmId>` as manually
# configured `mqtt:` binary sensors instead.
#
# `PoolPhPumpMaxUptime`, `PoolChlorinePumpMaxUptime`, `PoolPressureLow`,
# `PoolPressureHigh` and `PoolPhDoseNoEffect` are latched alarms. Their
# matching HA reset buttons are:
# - slot 0 -> button.fio53_alm_reset_slot_0
# - slot 1 -> button.fio53_alm_reset_slot_1
# - slot 4 -> button.fio53_alm_reset_slot_4
# - slot 5 -> button.fio53_alm_reset_slot_5
# - slot 7 -> button.fio53_alm_reset_slot_7

- binary_sensor:
      - name: fio53_alarm_any_active
        unique_id: fio53_alarm_any_active
        icon: mdi:alarm-multiple
        availability: >
          {{ states('binary_sensor.fio53_alm_any') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.fio53_alm_any', 'on') }}

      - name: fio53_psi_low_active
        unique_id: fio53_psi_low_active
        icon: mdi:alarm-light
        availability: >
          {{ states('binary_sensor.fio53_alm_pressure_low') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.fio53_alm_pressure_low', 'on') }}

      - name: fio53_psi_low_resettable
        unique_id: fio53_psi_low_resettable
        icon: mdi:restart-alert
        availability: >
          {{ states('sensor.fio53_alm_pack') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set pack = states('sensor.fio53_alm_pack') | int(0) %}
          {{ ((pack // 2) % 2) == 1 }}

      - name: fio53_psi_low_condition
        unique_id: fio53_psi_low_condition
        icon: mdi:flash-alert
        availability: >
          {{ states('sensor.fio53_alm_pack') not in ['unknown', 'unavailable', 'none'] }}
        state: >
          {% set pack = states('sensor.fio53_alm_pack') | int(0) %}
          {{ ((pack // 4) % 2) == 1 }}

      - name: fio53_psi_high_active
        unique_id: fio53_psi_high_active
        icon: mdi:alarm-light
        availability: >
          {{ states('binary_sensor.fio53_alm_pressure_high') in ['on', 'off'] }}
