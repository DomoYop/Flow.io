# Home Assistant helper entities for Flow.io alarms.
#
# Include from configuration.yaml:
#
#   template: !include home_assistant_alarm_helpers_pool.yaml
#
# Firmware behavior:
# - Flow.io auto-discovers one `binary_sensor.pool_alm_*` per alarm, fed by the
#   retained topic `rt/alarms/id<AlarmId>` (field `a`).
# - Flow.io auto-discovers `binary_sensor.pool_alm_any` (topic `rt/alarms/m`).
# - Flow.io auto-discovers one `button.pool_alm_ack_*` per alarm plus
#   `button.pool_alm_ack_all`, using the command path
#   `{"cmd":"alarms.ack","args":{"id":<AlarmId>}}`.
#   Acknowledging is a single gesture: it clears the alarm when the cause is
#   already gone, and silences it otherwise.
#
# The helpers below only rename and derive those native entities. The
# `*_resettable`, `*_acknowledged` and `*_condition` helpers read the sensors
# declared in `home_assistant_alarm_mqtt_pool.yaml`, which must be installed
# too. Nothing here depends on the alarm registration order any more -- the
# former `sensor.pool_alm_pack` bit decoding is gone.

- binary_sensor:

      - name: pool_alarm_any_active
        unique_id: pool_alarm_any_active
        icon: mdi:alarm-multiple
        availability: >
          {{ states('binary_sensor.pool_alm_any') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.pool_alm_any', 'on') }}

      # AlarmId 1000 -- Low pressure (latched)
      - name: pool_pressure_low_active
        unique_id: pool_pressure_low_active
        icon: mdi:alarm-light
        availability: >
          {{ states('binary_sensor.pool_alm_pressure_low') in ['on', 'off'] }}
        state: >
          {{ is_state('binary_sensor.pool_alm_pressure_low', 'on') }}

      - name: pool_pressure_low_condition
        unique_id: pool_pressure_low_condition
        icon: mdi:flash-alert
        availability: >
          {{ has_value('sensor.pool_pressure_low_state') }}
        state: >
          {{ state_attr('sensor.pool_pressure_low_state', 'c') | int(2) == 1 }}

      - name: pool_pressure_low_acknowledged
        unique_id: pool_pressure_low_acknowledged
        icon: mdi:bell-check-outline
        availability: >
          {{ has_value('sensor.pool_pressure_low_state') }}
        state: >
          {{ state_attr('sensor.pool_pressure_low_state', 'k') | int(0) == 1 }}

      - name: pool_pressure_low_resettable
        unique_id: pool_pressure_low_resettable
        icon: mdi:restart-alert
        availability: >
          {{ has_value('sensor.pool_pressure_low_state') }}
        state: >
          {{ state_attr('sensor.pool_pressure_low_state', 'r') | int(0) == 1 }}

