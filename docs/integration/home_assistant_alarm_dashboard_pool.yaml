# Example Lovelace stack for Flow.io alarms.
#
# Paste this card into a dashboard view. It is not a full dashboard export.
# It assumes:
# - the helper entities from `home_assistant_alarm_helpers_pool.yaml` are installed
# - custom cards `bubble-card`, `mushroom`, and `service-call` are available
# - the MQTT topic below is updated to match your device:
#   `flowio/poolbox/cmd`
#
# Acknowledge behavior:
# - use `{"cmd":"alarms.ack","args":{"id":<AlarmId>}}`
# - acknowledging is a single gesture: it clears the alarm when the cause is
#   already gone, and silences the annunciation otherwise
# - the button is disabled only when the alarm is not active
# - Home Assistant also auto-discovers `button.pool_alm_ack_*` per alarm, which
#   does the same thing without any MQTT payload to maintain here

type: vertical-stack
cards:
  - type: custom:bubble-card
    card_type: pop-up
    hash: "#alerts"
    button_type: name
    sub_button:
      main: []
      bottom: []
    show_header: true
    name: Alarms
    icon: m3o:warning

  - type: custom:mushroom-template-card
    entity: binary_sensor.pool_pressure_low_active
    primary: Low pressure
    secondary: >-
      {% if is_state('binary_sensor.pool_pressure_low_active', 'off') %}
        Off
      {% elif is_state('binary_sensor.pool_pressure_low_condition', 'off') %}
        Triggered (inactive)
      {% else %}
        Triggered (active)
      {% endif %} ({{
      relative_time(states["binary_sensor.pool_pressure_low_active"].last_changed)
      }})
    icon: mdi:gauge-empty
    icon_tap_action:
      action: none
    hold_action:
      action: none
    color: |
      {% if is_state('binary_sensor.pool_pressure_low_active', 'off') %}
        green
      {% elif is_state('binary_sensor.pool_pressure_low_condition', 'off') %}
        orange
      {% else %}
        red
      {% endif %}
    features_position: inline
    multiline_secondary: false
    features:
      - type: custom:service-call
        entries:
          - type: button
            icon: mdi:restart-alert
            entity_id: binary_sensor.pool_pressure_low_active
            value_attribute: state
            haptics: true
            autofill_entity_id: false
            tap_action:
              action: call-service
              service: mqtt.publish
              data:
                topic: flowio/poolbox/cmd
                payload: "{\"cmd\":\"alarms.ack\",\"args\":{\"id\":1000}}"
                qos: 0
                retain: false
            hold_action:
              action: none
            styles: |-
              :host {
                {% if is_state('binary_sensor.pool_pressure_low_active', 'off') %}
                --icon-color: var(--disabled-color);
                opacity: 0.45;
                pointer-events: none;
                {% endif %}
              }

